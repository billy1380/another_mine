name: another_mine_workspace
publish_to: "none"

environment:
  sdk: ^3.13.0

workspace:
  - packages/client_common
  - packages/client_flutter
  - packages/client_web
  - packages/mine_images

# willshex_dart_service_discovery still depends on build ^3, which jaspr_builder
# cannot share. Same overrides as willshex_triangles.
dependency_overrides:
  build: ^4.0.0
  dart_style: 3.1.8
  analyzer: ^12.1.0
  cli_util: ^0.5.0
