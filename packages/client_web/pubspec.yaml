name: another_mine_web
description: Jaspr web client for Another Mine. Also embeddable in other Jaspr apps.
publish_to: "none"
version: 1.0.0+1
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  another_mine_flutter:
    path: ../client_flutter
  another_mine_common:
    path: ../client_common
  mine_images:
    path: ../mine_images
  willshex:
    path: ../../../willshex-dart
  willshex_dart_service_discovery:
    path: ../../../willshex_dart_service_discovery
  willshex_embedding:
    path: ../../../willshex_embedding
  main_thread_processor:
    path: ../../../main_thread_processor

  jaspr: ^0.23.5
  jaspr_router: ^0.9.0
  jaspr_flutter_embed: ^0.4.11
  web: ^1.1.1
  bloc: ^9.2.1
  logging: ^1.3.0

dev_dependencies:
  jaspr_builder: ^0.23.5
  jaspr_cli: ^0.23.5
  build_runner: ^2.15.1
  build_web_compilers: ^4.8.5
  lints: ^6.0.0

jaspr:
  port: 8083
  uses-ssr: false
  mode: client
  flutter: embedded

flutter:
  uses-material-design: true
