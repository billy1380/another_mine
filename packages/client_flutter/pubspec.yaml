name: another_mine_flutter
description: Flutter client for Another Mine, for mobile and desktop. Also embeddable in other Flutter apps.
publish_to: "none"
version: 1.0.0+1
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter

  another_mine_common:
    path: ../client_common
  mine_images:
    path: ../mine_images
  willshex:
    path: ../../../willshex-dart
  willshex_dart_service_discovery:
    path: ../../../willshex_dart_service_discovery
  willshex_embedding:
    path: ../../../willshex_embedding
  main_thread_processor:
    path: ../../../main_thread_processor

  bloc: ^9.2.1
  flutter_bloc: ^9.1.1
  equatable: ^2.0.5
  go_router: ">=11.1.4 <18.0.0"
  shared_preferences: ^2.2.2
  flutter_colorpicker: ^1.1.0
  collection: ^1.19.1
  logging: ^1.3.0
  meta: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  bloc_test: ^10.0.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "images/icon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "images/icon.png"
    background_color: "#ffffff"
  windows:
    generate: true
    image_path: "images/icon.png"
    icon_size: 48
  linux:
    generate: true
    image_path: "images/icon.png"
  macos:
    generate: true
    image_path: "images/icon.png"

flutter:
  uses-material-design: true
