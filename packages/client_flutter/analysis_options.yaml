analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
include: package:flutter_lints/flutter.yaml

linter:
  rules:
    prefer_single_quotes: false
    prefer_double_quotes: true
    curly_braces_in_flow_control_structures: true
